<section class="continue-row">
  <h2 class="section-title">{{ title }}</h2>
  <div class="track">
    @for (entry of items; track entry.item.id) {
      @let c = card(entry);
      <a class="card" [routerLink]="c.link">
        @if (c.image) {
          <img [src]="c.image" [alt]="c.title" loading="lazy" decoding="async" />
        } @else {
          <div class="placeholder">{{ c.title }}</div>
        }

        <p-tag severity="contrast" styleClass="episode-tag" [value]="c.progress" />

        <div class="overlay">
          <h3>{{ c.title }}</h3>
        </div>

        @if (c.percent !== null) {
          <p-progressbar
            styleClass="watch-progress"
            [value]="c.percent"
            [showValue]="false"
            [attr.aria-label]="c.percent + '% vu'"
          />
        }
      </a>
    }
  </div>
</section>
