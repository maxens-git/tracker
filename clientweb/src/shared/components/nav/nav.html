<nav class="topbar">
  <a routerLink="/home" class="brand" (click)="close()" aria-label="Tracker accueil">
    <span class="brand-mark"><img src="/favicon.ico" alt="" /></span>
    <span>Tracker</span>
  </a>

  <button
    pButton
    pRipple
    type="button"
    icon="pi pi-bars"
    class="menu-button"
    severity="secondary"
    text
    rounded
    (click)="toggle()"
    aria-label="Menu"
  ></button>
</nav>

<aside class="sidebar" aria-label="Navigation principale">
  <a routerLink="/home" class="brand" aria-label="Tracker accueil">
    <span class="brand-mark"><img src="/favicon.ico" alt="" /></span>
    <span>Tracker</span>
  </a>

  <div class="nav-links">
    @for (item of items; track item.path) {
      <a
        pRipple
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="item.path === '/home' ? { exact: true } : { exact: false }"
        class="nav-link"
      >
        @if (pendingPath() === item.path) {
          <i class="pi pi-spin pi-spinner"></i>
        } @else {
          <i [class]="item.icon"></i>
        }
        <span>{{ item.label }}</span>
        @if (item.badge) {
          <span class="nav-badge">{{ item.badge }}</span>
        }
      </a>
    }
  </div>

  <div class="sidebar-footer">
    <span class="status-dot"></span>
    <span>Local</span>
  </div>
</aside>

<p-drawer
  [visible]="open()"
  (visibleChange)="open.set($event)"
  position="left"
  styleClass="mobile-nav-drawer"
  [showCloseIcon]="false"
  [blockScroll]="true"
>
  <div class="drawer-content">
    <a routerLink="/home" class="brand" (click)="close()" aria-label="Tracker accueil">
      <span class="brand-mark"><img src="/favicon.ico" alt="" /></span>
      <span>Tracker</span>
    </a>

    <div class="nav-links">
      @for (item of items; track item.path) {
        <a
          pRipple
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="item.path === '/home' ? { exact: true } : { exact: false }"
          class="nav-link"
          (click)="close()"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
          @if (item.badge) {
            <span class="nav-badge">{{ item.badge }}</span>
          }
        </a>
      }
    </div>
  </div>
</p-drawer>
