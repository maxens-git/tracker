<a class="poster" [routerLink]="detailLink">
  @if (poster) {
    <img [src]="poster" [alt]="title" loading="lazy" decoding="async" />
  } @else {
    <div class="placeholder">{{ title }}</div>
  }

  <div class="overlay">
    <h3>{{ title }}</h3>
    @if (year) {
      <span class="year">{{ year }}</span>
    }
  </div>

  <div class="badges">
    @if (item.seen) {
      <p-tag severity="success" icon="pi pi-check" value="Vu" />
    }
    @if (rating) {
      <p-tag severity="contrast" icon="pi pi-star-fill" [value]="rating" />
    }
  </div>
</a>
