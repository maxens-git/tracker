<div class="settings-page">
  <div class="page-header">
    <h1 class="page-title">Réglages</h1>
  </div>

  @if (loading()) {
    <app-spinner />
  } @else {
    <form class="settings-panel" (ngSubmit)="save()">
      <div class="toggle-row">
        <span>
          <strong>Notifications ntfy</strong>
          <small>Envoyer une notification quand une sortie suivie approche.</small>
        </span>
        <p-toggleswitch name="ntfyEnabled" [(ngModel)]="form.ntfyEnabled" ariaLabel="Notifications ntfy" />
      </div>

      <label class="field">
        <span>URL ntfy</span>
        <input pInputText name="ntfyUrl" type="url" [(ngModel)]="form.ntfyUrl" placeholder="https://ntfy.sh" />
      </label>

      <label class="field">
        <span>Topic</span>
        <input pInputText name="ntfyTopic" [(ngModel)]="form.ntfyTopic" placeholder="tracker-sorties" />
      </label>

      <label class="field">
        <span>Token</span>
        <input pInputText name="ntfyToken" type="password" [(ngModel)]="form.ntfyToken" autocomplete="new-password" />
      </label>

      <label class="field compact">
        <span>Prévenir combien de jours avant</span>
        <input pInputText name="notifyDaysAhead" type="number" min="0" max="30" [(ngModel)]="form.notifyDaysAhead" />
      </label>

      <label class="field compact">
        <span>Heure d’envoi</span>
        <input pInputText name="notificationTime" type="time" [(ngModel)]="notificationTime" />
      </label>

      <div class="form-actions">
        <button pButton class="save-btn" type="submit" [class.confirmed]="saved()" [disabled]="saving() || testing()">
          <i [class]="saving() ? 'pi pi-spinner pi-spin' : (saved() ? 'pi pi-check' : 'pi pi-save')"></i>
          <span>{{ saved() ? 'Enregistré' : 'Enregistrer' }}</span>
        </button>

        <button
          pButton
          class="test-btn"
          type="button"
          severity="secondary"
          [class.confirmed]="testSent()"
          [disabled]="saving() || testing()"
          (click)="sendTestNotification()"
        >
          <i [class]="testing() ? 'pi pi-spinner pi-spin' : (testSent() ? 'pi pi-check' : 'pi pi-send')"></i>
          <span>{{ testSent() ? 'Envoyé' : 'Envoyer un test' }}</span>
        </button>
      </div>
    </form>

    <section class="settings-panel calendar-panel">
      <div class="toggle-row">
        <span>
          <strong>Calendrier des sorties</strong>
          <small>Abonne ton calendrier aux sorties suivies. Ajouts et suppressions se synchronisent automatiquement.</small>
        </span>
      </div>

      <div class="form-actions">
        <button pButton class="save-btn" type="button" [disabled]="calendarSubscribeLoading()" (click)="subscribeToCalendar()">
          <i [class]="calendarSubscribeLoading() ? 'pi pi-spinner pi-spin' : 'pi pi-calendar-plus'"></i>
          <span>{{ calendarSubscribeLoading() ? 'Ouverture…' : "S'abonner" }}</span>
        </button>

        <button
          pButton
          class="copy-btn"
          type="button"
          severity="secondary"
          [class.confirmed]="calendarCopied()"
          [disabled]="calendarCopying()"
          (click)="copyCalendarLink()"
        >
          <i [class]="calendarCopying() ? 'pi pi-spinner pi-spin' : (calendarCopied() ? 'pi pi-check' : 'pi pi-copy')"></i>
          <span>{{ calendarCopied() ? 'Copié' : 'Copier le lien' }}</span>
        </button>
      </div>
    </section>
  }
</div>
