@if (loading()) {
  <app-spinner />
} @else if (error()) {
  <div class="status text-center py-5 px-4 error">{{ error() }}</div>
} @else if (data(); as d) {
  @if (hero(d); as h) {
    <header class="hero d-flex align-items-end" [style.background-image]="h.backdrop ? 'var(--hero-home-overlay), url(' + h.backdrop + ')' : null">
      <div class="hero-content">
        <span class="eyebrow">À l'affiche</span>
        <h1>{{ h.title }}</h1>
        @if (h.year) { <span class="year d-inline-block mb-3">{{ h.year }}</span> }
        @if (h.overview) { <p>{{ h.overview }}</p> }
        <a class="btn-detail" [routerLink]="h.link">
          <i class="pi pi-play"></i>
          Voir la fiche
        </a>
      </div>
    </header>
  }

  <main class="rows mx-auto pb-5 pt-4 px-4">
    @if (d.continueWatching.length) {
      <app-continue-row title="Reprendre" [items]="d.continueWatching" />
    }
    <app-media-row title="Tendances de la semaine" [items]="d.trendingWeek" />
    <app-media-row title="Films populaires" [items]="d.popularMovies" />
    <app-media-row title="Séries populaires" [items]="d.popularShows" />
    <app-media-row title="Mieux notés" [items]="d.topRated" />
  </main>
}
