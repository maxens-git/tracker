@if (loading()) {
  <app-spinner />
} @else if (error()) {
  <div class="page">
    <p-message severity="error" styleClass="state-message" [text]="error()!" />
  </div>
} @else if (data(); as d) {
  @if (hero(d); as h) {
    <header class="hero" [style.background-image]="h.backdrop ? 'var(--hero-overlay), url(' + h.backdrop + ')' : null">
      <div class="hero-content">
        <p-tag severity="secondary" value="À l'affiche" />

        <h1>{{ h.title }}</h1>

        @if (h.year) {
          <p-tag severity="secondary" [value]="h.year" />
        }
        @if (h.overview) {
          <p>{{ h.overview }}</p>
        }

        <a pButton icon="pi pi-play" label="Voir la fiche" [routerLink]="h.link"></a>
      </div>
    </header>
  }

  <div class="rows">
    @if (d.continueWatching.length) {
      <app-continue-row title="Reprendre" [items]="d.continueWatching" />
    }
    <app-media-row title="Tendances de la semaine" [items]="d.trendingWeek" />
    <app-media-row title="Films populaires" [items]="d.popularMovies" />
    <app-media-row title="Séries populaires" [items]="d.popularShows" />
    <app-media-row title="Mieux notés" [items]="d.topRated" />
  </div>
}
