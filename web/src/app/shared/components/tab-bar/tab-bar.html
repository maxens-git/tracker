<p-menubar [model]="items" class="tabbar" [breakpoint]="'0px'">
  <ng-template pTemplate="end">
    <div class="d-flex align-items-center gap-2">
      <p-menu #profileMenu [model]="profileItems" [popup]="true"></p-menu>
      <p-button
        icon="pi pi-user"
        (onClick)="profileMenu.toggle($event)"
        size="small"
        severity="secondary"
        [rounded]="true"
        [text]="true">
      </p-button>
    </div>
  </ng-template>
</p-menubar>
