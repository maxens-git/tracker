<p-menubar [model]="items" class="tabbar">
  <ng-template pTemplate="end">
    <div class="d-flex align-items-center gap-2">
      <p-avatar
        icon="pi pi-user"
        shape="circle"
        [style]="{ 'background-color': '#2196F3', color: '#ffffff', cursor: 'pointer' }">
      </p-avatar>
    </div>
  </ng-template>
</p-menubar>
