<button class="poster-card" type="button" (click)="onSelect()">
  <div class="poster-card__image">
    @if (item.poster_path) {
      <img [src]="'https://image.tmdb.org/t/p/w500' + item.poster_path" [alt]="getDisplayTitle()" loading="lazy" />
    } @else {
      <div class="poster-card__placeholder">{{ getDisplayTitle() }}</div>
    }
    <div class="poster-card__badges">
      <span class="badge rating">
        <span class="pi pi-star"></span>
        {{ getRating() }}
      </span>
      <div style="display: flex; justify-content: space-between; width: 100%; position: absolute; left: 0; bottom: 0; padding: 0.5rem; pointer-events: none;">
        <span class="badge type" style="pointer-events: auto;">{{ getType() }}</span>
        <span class="badge year" style="pointer-events: auto;">{{ getYear() }}</span>
      </div>
    </div>
  </div>
</button>
