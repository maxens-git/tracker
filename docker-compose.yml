version: "3.9"

services:
  tracker:
    build: .
    container_name: tracker
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=tracker;Uid=tracker;Pwd=tracker;
      JustWatch__EnableImport: "false"
    restart: unless-stopped
